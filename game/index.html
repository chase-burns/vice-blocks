<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Blocks 3D</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="gl"></canvas>
<div id="vignette"></div>
<div id="speedfx"></div>
<section id="hud">
  <div class="bar-wrap"><div class="bar"><div id="health"></div></div></div>
  <div class="bar-wrap armor-wrap"><div class="bar"><div id="armor"></div></div></div>
  <div id="mission"></div>
  <div id="dispatch"></div>
  <div id="slots"></div>
  <div id="district"></div>
  <div id="cash">$0000000</div>
  <div id="stars">☆☆☆☆☆</div>
  <div id="respectWrap"><div id="respectfill"></div></div>
  <div id="rank"></div>
  <div id="banner"></div>
  <div id="msg"></div>
  <div id="timer"></div>
  <div id="bustlabel">BUSTED</div>
  <div id="bustbar"><div id="bustfill"></div></div>
  <div id="prompt"></div>
  <div id="crosshair">+</div>
  <canvas id="minimap" width="168" height="168"></canvas>
  <div id="speed"></div>
  <div id="weapon"></div>
</section>
<div id="help">
  WASD drive / walk · Mouse look · F enter car · E interact · T taxi job ·
  R radio / reload · 1–4 weapons · Space handbrake · Shift run · P pause
</div>
<div id="overlay">
  <div id="ovTitle"></div>
  <div id="ovSub"></div>
  <div id="ovFeat"></div>
  <div id="ovSave"></div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
