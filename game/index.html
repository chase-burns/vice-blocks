<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Vice Blocks 3D</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="gl"></canvas>
<div id="vignette"></div>
<div id="hud">
  <div class="bar-wrap">
    <div class="bar"><div id="health"></div></div>
    <div class="bar"><div id="armor"></div></div>
  </div>
  <div id="mission"></div>
  <div id="cash">$0000000</div>
  <div id="stars">☆☆☆☆☆</div>
  <div id="banner"></div>
  <div id="msg"></div>
  <div id="timer"></div>
  <div id="bustlabel"></div>
  <div id="bustbar"><div id="bustfill"></div></div>
  <div id="prompt"></div>
  <div id="crosshair">+</div>
  <canvas id="minimap" width="168" height="168"></canvas>
  <div id="speed"></div>
  <div id="weapon">UNARMED</div>
</div>
<div id="help">WASD drive / move · Mouse look (click to lock)<br>Space handbrake — drift! · Shift run on foot<br>F steal / enter car · T taxi job · R reload<br>Right mouse aim · Left mouse shoot · E interact · P / Esc pause</div>
<div id="overlay"><div id="ovTitle">VICE BLOCKS 3D</div><div id="ovSub">PRESS ANY KEY TO HIT THE STREETS</div></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
